[package]
name = "ollama-client"
version = "0.1.0"
authors = ["Patryk Laurent <patryk@pakl.net>"]
edition = "2021"
description = "A chat client for a local ollama LLM server, with a scrollable response view"

# Dependency versions enforced by Cargo.lock.
[dependencies]
log = "0.4.14"
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
xous = "0.9.70"
xous-ipc = "0.10.10"
log-server = { package = "xous-api-log", version = "0.1.69" }
ticktimer-server = { package = "xous-api-ticktimer", version = "0.9.70" }
xous-names = { package = "xous-api-names", version = "0.9.71" }
gam = { path = "../../services/gam" }
# Only the prediction API types — we run our own no-op predictor (see predictor.rs)
# so the input line has no autocomplete bar to fight with the function keys.
ime-plugin-api = { path = "../../services/ime-plugin-api" }
modals = { path = "../../services/modals" }
net = { path = "../../services/net" }
pddb = { path = "../../services/pddb" }
# HTTP + JSON. ureq's default features already bundle a rustls TLS stack, but we
# use the Xous trust-store connector below (tls::xtls) so HTTPS to a self-signed
# or otherwise-untrusted host runs the trust-on-first-use flow, exactly like
# apps/sidplayer's netfetch. Plain HTTP (the LAN default) still works unchanged.
ureq = { version = "2.9.4", features = ["json"] }
# TLS trust store + the ureq connector (tls::xtls::TlsConnector) and the
# probe/trust-modal flow. Certificates the user trusts are saved in the PDDB.
tls = { path = "../../libs/tls" }
serde = { version = "1.0", features = ["derive"] }

[features]
default = []
